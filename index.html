<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baddonz</title>
    <link rel="icon" type="image/png" href="https://i.imgur.com/OAtRFEw.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #0d1117, #1b0033); color: #c9d1d9; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; text-align: center; overflow-x: hidden; }
        
        .top-banner { position: fixed; top: 0; left: 0; width: 100%; background-color: #FFDD00; color: #000; padding: 5px 0; font-weight: bold; font-size: 0.9em; z-index: 1001; box-shadow: 0 2px 5px rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; gap: 5px; }
        .top-banner a { color: #000; text-decoration: underline; display: inline-flex; align-items: center; gap: 4px; }
        .top-banner img { height: 18px; width: auto; vertical-align: middle; cursor: pointer; }
        
        .footer-banner { position: fixed; bottom: 0; left: 0; width: 100%; background-color: #161b22; color: #ff5555; padding: 10px 0; font-size: 0.9em; z-index: 1001; border-top: 1px solid #30363d; font-weight: 500; }
        .footer-banner a { color: #58a6ff; text-decoration: none; font-weight: bold; }
        
        .navbar { position: fixed; top: 28px; left: 0; width: 100%; background: rgba(13, 17, 23, 0.95); border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; padding: 10px 40px; box-sizing: border-box; z-index: 1000; }
        .nav-brand { display: flex; align-items: center; gap: 10px; font-size: 1.5em; font-weight: bold; color: #58a6ff; text-decoration: none; transition: 0.2s; }
        .nav-brand:hover { filter: brightness(1.2); }
        .nav-brand img { width: 35px; height: 35px; }
        
        .nav-links { display: flex; gap: 15px; }
        .nav-links a { color: #c9d1d9; text-decoration: none; font-size: 1.1em; font-weight: 600; display: flex; align-items: center; gap: 8px; background: #21262d; padding: 8px 15px; border-radius: 6px; border: 1px solid #30363d; transition: 0.2s; }
        .nav-links a:hover { background: #30363d; color: #fff; }
        
        @keyframes slideDown { 0% { transform: translateY(-100px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
        @keyframes slideUp { 0% { transform: translateY(50px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
        @keyframes slideLeft { 0% { transform: translateX(-100px); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
        @keyframes slideRight { 0% { transform: translateX(100px); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
        
        .content { padding: 40px 20px; z-index: 10; margin-top: 50px; }
        h1 { font-size: 5em; margin-bottom: 5px; color: #58a6ff; text-shadow: 0 0 15px rgba(88, 166, 255, 0.5); font-weight: 800; opacity: 0; animation: slideDown 1s ease-out forwards; animation-delay: 0.3s; }
        .subtitle { font-size: 1.2em; margin-bottom: 40px; color: #c9d1d9; opacity: 0; animation: slideUp 1s ease-out forwards; animation-delay: 0.7s; }
        .install-button { display: inline-block; padding: 12px 30px; font-size: 1.1em; font-weight: 600; text-decoration: none; color: #ffffff; background-color: #58a6ff; border-radius: 6px; transition: 0.2s; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4); border: none; opacity: 0; animation: slideUp 1s ease-out forwards; animation-delay: 1.1s; }
        .install-button:hover { background-color: #79b7ff; transform: translateY(-2px); }
        .discord-icon-fixed { position: fixed; bottom: 55px; left: 20px; z-index: 1000; transition: transform 0.2s; color: #58a6ff; font-size: 40px; text-decoration: none; opacity: 0; animation: slideLeft 1s ease-out forwards; animation-delay: 1.5s; }
        .discord-icon-fixed:hover { transform: scale(1.1); }
        
        .right-panel { position: fixed; right: 20px; top: 50%; transform: translateY(-50%); background: rgba(22, 27, 34, 0.95); border: 1px solid #30363d; border-radius: 12px; padding: 15px; width: 220px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.6); z-index: 999; opacity: 0; animation: slideRight 1s ease-out forwards; animation-delay: 1.5s; overflow: visible; }
        .right-panel h3 { margin: 0 0 10px 0; font-size: 1.1em; color: #fff; border-bottom: 1px solid #30363d; padding-bottom: 8px; position: relative; z-index: 3; }
        .right-panel img.ni-img { width: 100%; border-radius: 6px; margin-bottom: 10px; position: relative; z-index: 2; cursor: pointer; }
        .right-panel h4 { margin: 0 0 5px 0; color: #58a6ff; font-size: 1em; }
        .right-panel p { font-size: 0.85em; color: #8b949e; margin: 0 0 15px 0; }
        .right-panel .dc-btn { display: inline-block; width: 100%; padding: 8px 0; background: #5865F2; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 0.9em; transition: 0.2s; }
        .right-panel .dc-btn:hover { background: #4752C4; }

        /* Styl dla Dzika Uciekiniera */
        #runner-dzik {
            position: fixed;
            width: 80px;
            z-index: 9999;
            transition: left 0.25s ease-out, top 0.25s ease-out; /* Płynne uciekanie */
            pointer-events: none; /* Żeby nie blokował klikania w strone */
        }
    </style>
</head>
<body>
    <div class="top-banner">Spodobały Ci się dodatki? <a href="https://suppi.pl/besiak" target="_blank">Wesprzyj mnie <img id="banner-dzik" src="https://i.imgur.com/syTg29C.png" alt="Dzik"></a></div>
    
    <nav class="navbar">
        <a href="/" class="nav-brand"><img src="https://i.imgur.com/OAtRFEw.png" alt="Baddonz Logo">BADDONZ</a>
        <div class="nav-links"><a href="/dodatki"><i class="fas fa-puzzle-piece"></i> Dodatki</a></div>
    </nav>

    <div class="content">
        <h1>Baddonz</h1>
        <p class="subtitle">Dodatki do Margonem na Nowy Interfejs</p>
        <a href="https://besiak6.github.io/scripts/baddonz.user.js" class="install-button" target="_blank">Zainstaluj</a>
    </div>

    <a href="https://discord.gg/rJeNVHr49f" target="_blank" class="discord-icon-fixed"><i class="fab fa-discord"></i></a>
    
    <div class="right-panel">
        <h3>Polecane Serwery</h3>
        <img src="https://i.imgur.com/tFnmBzB.png" class="ni-img" alt="NI Theme">
        <h4>NI Theme</h4>
        <p>Najlepszy motyw na NI - DarkensUI by xallergoat</p>
        <a href="https://discord.gg/66Kt4jZnTb" target="_blank" class="dc-btn"><i class="fab fa-discord"></i> Dołącz</a>
    </div>
    
    <div class="footer-banner">Znalazłeś błąd lub masz jakiś problem? Dołącz do <a href="https://discord.gg/rJeNVHr49f" target="_blank">discorda</a>, lub napisz do mnie na dc: besiak6</div>

    <!-- Dzik Uciekinier ukryty poza ekranem na start -->
    <img id="runner-dzik" src="https://i.imgur.com/syTg29C.png" alt="Dzik Uciekinier" style="top: 150%; left: 50%;">

    <script>
        const bannerDzik = document.getElementById('banner-dzik');
        const runnerDzik = document.getElementById('runner-dzik');
        let hoverTimer;
        let isRunnerActive = false;

        // Odliczanie 5 sekund
        bannerDzik.addEventListener('mouseenter', () => {
            if (isRunnerActive) return;
            hoverTimer = setTimeout(() => {
                isRunnerActive = true;
                
                // Dzik wyskakuje ze stopki
                runnerDzik.style.top = (window.innerHeight - 150) + 'px';
                runnerDzik.style.left = (window.innerWidth / 2 - 40) + 'px';

                // Nasłuchiwacz uciekania
                document.addEventListener('mousemove', runawayDzik);
            }, 5000); // 5000ms = 5 sekund
        });

        // Przerwanie odliczania, jeśli zjedziesz wcześniej
        bannerDzik.addEventListener('mouseleave', () => {
            clearTimeout(hoverTimer);
        });

        // Funkcja spierdalania dzika xD
        function runawayDzik(e) {
            const dzikRect = runnerDzik.getBoundingClientRect();
            const dzikCenterX = dzikRect.left + (dzikRect.width / 2);
            const dzikCenterY = dzikRect.top + (dzikRect.height / 2);
            
            const mouseX = e.clientX;
            const mouseY = e.clientY;
            
            const distX = dzikCenterX - mouseX;
            const distY = dzikCenterY - mouseY;
            const distance = Math.sqrt(distX * distX + distY * distY);
            
            // Jeśli kursor jest bliżej niż 200px - dzik ucieka
            if (distance < 200) {
                // Odpychamy go o 300px w przeciwnym kierunku do kursora
                let moveX = (distX / distance) * 300;
                let moveY = (distY / distance) * 300;
                
                let newLeft = dzikRect.left + moveX;
                let newTop = dzikRect.top + moveY;
                
                // Trzymamy go w granicach ekranu (żeby nie uciekł za monitor)
                newLeft = Math.max(20, Math.min(window.innerWidth - 100, newLeft));
                newTop = Math.max(60, Math.min(window.innerHeight - 120, newTop));
                
                runnerDzik.style.left = newLeft + 'px';
                runnerDzik.style.top = newTop + 'px';
            }
        }
    </script>
</body>
</html>
