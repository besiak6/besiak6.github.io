<!-- === EASTER EGG: AK-47 SAFECRACKER & DESTRUCTION === -->
<style>
  /* Ukryty Klucz pod Żarówką */
  #hidden-key {
    position: absolute;
    display: none;
    font-size: 22px;
    color: #ffd700;
    cursor: pointer;
    z-index: 1;
    filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.8));
    animation: keyGlow 1.5s infinite alternate;
  }
  @keyframes keyGlow {
    from { transform: scale(1); filter: drop-shadow(0 0 5px #ffd700); }
    to { transform: scale(1.15); filter: drop-shadow(0 0 15px #ffaa00); }
  }

  /* Klucz przyklejony do kursora */
  #cursor-key {
    position: fixed;
    pointer-events: none;
    font-size: 28px;
    color: #ffd700;
    z-index: 99999;
    display: none;
    transform: translate(-50%, -50%) rotate(-45deg);
    filter: drop-shadow(0 0 10px rgba(255,215,0,0.9));
  }

  /* Stylizacja Kafelka Item Info jako Sejf */
  .safe-container {
    perspective: 1000px;
    position: relative;
  }
  .safe-door {
    transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    transform-origin: left center;
    transform-style: preserve-3d;
  }
  .safe-door.open {
    transform: rotateY(-115deg);
  }
  .safe-interior {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #080a0f;
    border: 2px dashed #ffaa00;
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 0;
    box-sizing: border-box;
  }
  #ak47-in-safe {
    width: 80%;
    cursor: pointer;
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.5));
    transition: transform 0.2s;
  }
  #ak47-in-safe:hover {
    transform: scale(1.1) rotate(-3deg);
  }

  /* Broń CS2 (Viewmodel) na dole ekranu */
  #cs2-viewmodel {
    position: fixed;
    bottom: -30px;
    right: 15%;
    width: 420px;
    pointer-events: none;
    z-index: 100000;
    display: none;
    transform-origin: bottom right;
    transition: transform 0.05s ease-out;
  }
  #cs2-viewmodel img {
    width: 100%;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8));
  }
  #muzzle-flash {
    position: absolute;
    top: 15px;
    left: 20px;
    width: 90px;
    height: 90px;
    background: radial-gradient(circle, #ffffff 10%, #ffaa00 40%, transparent 70%);
    border-radius: 50%;
    display: none;
    box-shadow: 0 0 40px #ff5500;
  }

  /* Dziury po kulach i efekty zniszczeń */
  .bullet-hole {
    position: fixed;
    width: 12px;
    height: 12px;
    background: #111;
    border: 2px solid #333;
    border-radius: 50%;
    pointer-events: none;
    z-index: 99998;
    box-shadow: inset 0 0 4px #000, 0 0 6px rgba(0,0,0,0.8);
    transform: translate(-50%, -50%);
  }
  .bullet-hole::after {
    content: '';
    position: absolute;
    top: -4px; left: -4px; right: -4px; bottom: -4px;
    border: 1px dashed rgba(255,255,255,0.3);
    border-radius: 50%;
  }

  /* Klasy destrukcji elementów */
  .damaged-light {
    transform: rotate(3deg) scale(0.98);
    filter: contrast(1.2);
  }
  .damaged-heavy {
    transform: rotate(-8deg) translateY(15px) !important;
    opacity: 0.8;
  }
  .destroyed-element {
    transition: transform 0.8s ease-in, opacity 0.8s !important;
    transform: translateY(1000px) rotate(45deg) !important;
    opacity: 0 !important;
    pointer-events: none !important;
  }
</style>

<!-- Pływający Klucz przy kursorze -->
<div id="cursor-key"><i class="fas fa-key"></i></div>

<!-- Widok broni CS2 -->
<div id="cs2-viewmodel">
  <div id="muzzle-flash"></div>
  <img src="https://i.imgur.com/8Qp2Z5E.png" alt="AK47 CS2 Viewmodel">
</div>

<script>
(function() {
  let keyPicked = false;
  let fpsMode = false;
  const cursorKey = document.getElementById('cursor-key');
  const viewmodel = document.getElementById('cs2-viewmodel');
  const muzzleFlash = document.getElementById('muzzle-flash');

  // --- Web Audio API (Syntetyzator dźwięków CS2 bez plików MP3) ---
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;

    if (type === 'unlock') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(1200, now + 0.15);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.2);
    } 
    else if (type === 'ak47') {
      // Dźwięk strzału AK-47 (Szum + Głębokie uderzenie)
      const bufferSize = audioCtx.sampleRate * 0.25;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(3000, now);
      filter.frequency.exponentialRampToValueAtTime(200, now + 0.2);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.8, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(now);

      // Basowy impuls strzału
      const sub = audioCtx.createOscillator();
      const subGain = audioCtx.createGain();
      sub.type = 'sawtooth';
      sub.frequency.setValueAtTime(160, now);
      sub.frequency.exponentialRampToValueAtTime(30, now + 0.2);
      subGain.gain.setValueAtTime(0.7, now);
      subGain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
      sub.connect(subGain); subGain.connect(audioCtx.destination);
      sub.start(now); sub.stop(now + 0.2);
    }
  }

  // --- KROK 1 & 2: Żarówka, Przesuwanie i Odkrycie Klucza ---
  window.addEventListener('DOMContentLoaded', () => {
    const rightPanel = document.querySelector('.right-panel');
    const panelTitle = rightPanel ? rightPanel.querySelector('h3') : null;

    if (panelTitle) {
      panelTitle.style.position = 'relative';
      
      // Tworzenie ukrytego klucza pod nagłówkiem/żarówką
      const hiddenKey = document.createElement('i');
      hiddenKey.id = 'hidden-key';
      hiddenKey.className = 'fas fa-key';
      hiddenKey.style.left = '20px';
      hiddenKey.style.top = '5px';
      panelTitle.appendChild(hiddenKey);

      // Dodanie ikonki żarówki
      const bulb = document.createElement('i');
      bulb.className = 'fas fa-lightbulb';
      bulb.style.cssText = 'cursor: grab; margin-right: 8px; color: #f1e05a; position: relative; z-index: 2; transition: transform 0.1s;';
      panelTitle.insertBefore(bulb, panelTitle.firstChild);

      // Przesuwanie żarówki
      let isDragging = false;
      let startX, startY;

      bulb.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.clientX - bulb.offsetLeft;
        startY = e.clientY - bulb.offsetTop;
        bulb.style.cursor = 'grabbing';
        hiddenKey.style.display = 'block'; // Odkryj klucz pod spodem
      });

      document.addEventListener('mousemove', (e) => {
        if (isDragging) {
          bulb.style.position = 'absolute';
          bulb.style.left = (e.clientX - rightPanel.getBoundingClientRect().left - 15) + 'px';
          bulb.style.top = (e.clientY - rightPanel.getBoundingClientRect().top - 15) + 'px';
        }

        // Podążanie klucza za kursorem po podniesieniu
        if (keyPicked && !fpsMode) {
          cursorKey.style.left = e.clientX + 'px';
          cursorKey.style.top = e.clientY + 'px';
        }

        // Poruszanie bronią w trybie FPS (Sway / Ruch myszką)
        if (fpsMode) {
          const moveX = (e.clientX - window.innerWidth / 2) * 0.03;
          const moveY = (e.clientY - window.innerHeight / 2) * 0.03;
          viewmodel.style.transform = `translate(${moveX}px, ${moveY}px)`;
        }
      });

      document.addEventListener('mouseup', () => {
        isDragging = false;
        if (bulb) bulb.style.cursor = 'grab';
      });

      // Podniesienie klucza
      hiddenKey.addEventListener('click', (e) => {
        e.stopPropagation();
        keyPicked = true;
        hiddenKey.style.display = 'none';
        cursorKey.style.display = 'block';
        playSound('unlock');
      });
    }

    // --- KROK 3 & 4: Zamek "i" w Item Info i Sejf z AK-47 ---
    // Szukamy kafelka z Item Info (lub dowolnego pierwszego kafelka z dodatkiem)
    const cards = document.querySelectorAll('.right-panel, .content, div[class*="card"]');
    let itemInfoCard = Array.from(document.querySelectorAll('div')).find(el => el.textContent.includes('Item Info')) || cards[0];

    if (itemInfoCard) {
      itemInfoCard.classList.add('safe-container');

      // Tworzenie wnętrza sejfu
      const interior = document.createElement('div');
      interior.className = 'safe-interior';
      interior.innerHTML = `<img id="ak47-in-safe" src="https://i.imgur.com/8Qp2Z5E.png" title="Kliknij, aby podnieść AK-47!" alt="AK-47">`;
      
      // Owiń dotychczasową zawartość kafelka w drzwi sejfu
      const door = document.createElement('div');
      door.className = 'safe-door';
      while (itemInfoCard.firstChild) {
        door.appendChild(itemInfoCard.firstChild);
      }

      itemInfoCard.appendChild(interior);
      itemInfoCard.appendChild(door);

      // Stworzenie niebieskiej ikonki "i" (Zamek)
      const infoBadge = document.createElement('div');
      infoBadge.style.cssText = 'position: absolute; top: 10px; right: 10px; width: 24px; height: 24px; background: #388bfd; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-family: sans-serif; font-size: 13px; cursor: pointer; z-index: 10; box-shadow: 0 0 8px rgba(56, 139, 253, 0.8);';
      infoBadge.innerText = 'i';
      door.appendChild(infoBadge);

      // Otwarcie Sejfu po kliknięciu kluczem w ikonkę "i"
      infoBadge.addEventListener('click', (e) => {
        if (keyPicked) {
          e.stopPropagation();
          keyPicked = false;
          cursorKey.style.display = 'none';
          playSound('unlock');
          door.classList.add('open');
        }
      });

      // Podniesienie AK-47 z Sejfu
      document.getElementById('ak47-in-safe').addEventListener('click', () => {
        fpsMode = true;
        interior.style.display = 'none';
        viewmodel.style.display = 'block';
        document.body.style.cursor = 'crosshair';
        playSound('unlock');
      });
    }
  });

  // --- KROK 5: Strzelanie & System Zniszczeń Strony ---
  document.addEventListener('click', (e) => {
    if (!fpsMode) return;

    // 1. Dźwięk i animacja odrzutu broni CS2
    playSound('ak47');
    viewmodel.style.transform += ' translateY(25px) rotate(-8deg) scale(1.08)';
    muzzleFlash.style.display = 'block';

    setTimeout(() => {
      muzzleFlash.style.display = 'none';
    }, 40);

    // 2. Dziura po kuli na ekranie
    const hole = document.createElement('div');
    hole.className = 'bullet-hole';
    hole.style.left = e.clientX + 'px';
    hole.style.top = e.clientY + 'px';
    document.body.appendChild(hole);

    // 3. System Zniszczeń Trafionego Elementu
    const target = document.elementFromPoint(e.clientX, e.clientY);
    if (target && target !== document.body && target !== document.documentElement && !target.classList.contains('bullet-hole')) {
      let hits = parseInt(target.dataset.hits || '0') + 1;
      target.dataset.hits = hits;

      if (hits === 1) {
        target.classList.add('damaged-light');
      } else if (hits === 2) {
        target.classList.remove('damaged-light');
        target.classList.add('damaged-heavy');
      } else if (hits >= 3) {
        target.classList.remove('damaged-heavy');
        target.classList.add('destroyed-element');
      }
    }
  });
})();
</script>
